AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SME Energy Advisor, infrastructure as code (Lambda, DynamoDB, alarms)

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives alarm notifications
  AgentUserName:
    Type: String
    Default: sme-agent
    Description: Existing IAM user that may call the function URL

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED          # on-demand has no free allowance
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7                # logs cost money if kept forever

  Function:
    Type: AWS::Serverless::Function
    Properties:
      Description: SME tariff calculator and bill summary
      CodeUri: lambda_build/
      Handler: handler.lambda_handler
      Runtime: python3.12
      MemorySize: 512                   # chosen from the memory experiments
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query    # one action, one table
              Resource: !GetAtt Table.Arn
      FunctionUrlConfig:
        AuthType: AWS_IAM               # callers must sign requests

  AgentInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-invoke-function-url"
      Users:
        - !Ref AgentUserName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunctionUrl
            Resource: !GetAtt Function.Arn
            Condition:
              StringEquals:
                lambda:FunctionUrlAuthType: AWS_IAM
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt Function.Arn
            Condition:
              Bool:
                lambda:InvokedViaFunctionUrl: "true"

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  HandledErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: ERROR_RESPONSE
      MetricTransformations:
        - MetricName: HandledErrors
          MetricNamespace: SmeAdvisorIac
          MetricValue: "1"
          DefaultValue: 0

  HandledErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Three or more failed requests in one minute
      Namespace: SmeAdvisorIac
      MetricName: HandledErrors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  CrashAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The function crashed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
  FunctionName:
    Value: !Ref Function